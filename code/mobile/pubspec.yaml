name: ajuda_ai
description: "Aplicativo móvel do Ajuda-aí."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  campus_map:
    path: packages/campus_map
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_preview: ^3.0.0
  file_picker: ^11.0.0
  flutter_appauth: ^12.0.0
  flutter_svg: ^2.2.4
  http: ^1.3.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.3
  gal: 2.3.3
  # Efeitos sonoros curtos da animação de novo nível (o Flutter não tem
  # reprodução de áudio própria além de cliques do sistema).
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/gamificacao/
    - assets/gamificacao/sons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
