services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ajudaai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ajudaai-local}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  postgres:
    # PostgreSQL 16 + PostGIS 3.5, mesma base Alpine do postgres:16-alpine
    # anterior: o volume existente continua compatível (ver
    # docs/tecnico/banco/migrations.md). As extensões entram por migration.
    image: postgis/postgis:16-3.5-alpine
    container_name: ajuda-ai-postgres
    # Mesmo search_path do Supabase (papel postgres): extensões em `extensions`.
    command: ['postgres', '-c', 'search_path="$$user", public, extensions']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ajudaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajudaai}
      POSTGRES_DB: ${POSTGRES_DATABASE:-ajudaai}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ajudaai} -d ${POSTGRES_DATABASE:-ajudaai}']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Substitui o init da imagem (que instalaria postgis, topology e tiger
      # em `public` num volume novo): local fica igual ao Supabase.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  rabbitmq-data:
  postgres-data:
    name: ajuda-ai_postgres-data

networks:
  default:
    name: ajuda-ai_default
