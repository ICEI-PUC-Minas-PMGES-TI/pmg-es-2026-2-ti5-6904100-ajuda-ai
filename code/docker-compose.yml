services:
  postgres:
    image: postgres:16-alpine
    container_name: ajuda-ai-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ajudaai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ajudaai}
      POSTGRES_DB: ${DB_DATABASE:-ajudaai}
    ports:
      - '${DB_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ajudaai} -d ${DB_DATABASE:-ajudaai}']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: ajuda-ai_postgres-data

networks:
  default:
    name: ajuda-ai_default
